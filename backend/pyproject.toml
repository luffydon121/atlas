[project]
name = "atlas-terminal"
version = "3.0.0"
description = "Local-first financial and global intelligence terminal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "defusedxml>=0.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.3",
  "rasterio>=1.3",
  "pillow>=10.4",
  "orjson>=3.13.0",
  "xlrd>=2.0.2",
  "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real public data sources (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "E501"]
